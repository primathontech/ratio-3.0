name: CI

permissions:
  contents: read

on:
  # Runs ONLY on a merge/push to main + manual dispatch — PR runs are intentionally disabled to
  # conserve the free GitHub Actions minutes (2000/mo). Validate PRs locally before merging:
  # `bun run typecheck && bun run lint && bun run format:check && bun run test`.
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ADMIN_URL: postgres://postgres@localhost:5432/postgres
      TEST_DATABASE_URL: postgres://postgres@localhost:5432/s2poc_test
    steps:
      - uses: actions/checkout@v7
      # Node runs the tests (node --import tsx --test); Bun is the package manager (bun.lock).
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun run test # runs test:setup (ensure-test-db + migrate) then node --test
      # Guard: the edge Worker bundle must stay Node-free — pino (Node-only) must never leak in via
      # @ratio/observability. The dry-run build itself fails on an unpolyfilled Node import; on top of
      # that, grep for pino's telltale Node writer `sonic-boom` (a real-bundle marker — the word "pino"
      # appears in our source comments, so we can't grep for that). (ADR-0002.)
      - name: Edge worker bundle stays Node-free (no pino)
        working-directory: apps/edge
        run: |
          npx wrangler deploy --dry-run --outdir /tmp/edge-bundle
          if grep -rliqE "sonic-boom|node:(fs|stream|worker_threads)" /tmp/edge-bundle; then
            echo "::error::a Node-only dependency (pino/sonic-boom) leaked into the edge Worker bundle"; exit 1
          fi

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # Only apply schema to prod. There is no seed — real stores come from onboarding.
      - name: Migrate Neon
        run: DATABASE_URL="${{ secrets.DATABASE_URL }}" bun run migrate
      - name: Deploy Worker
        run: npx wrangler deploy
      - name: Set Worker DATABASE_URL secret
        run: echo "${{ secrets.DATABASE_URL }}" | npx wrangler secret put DATABASE_URL
      # Path B: point the edge Worker at the container origin. Dormant until you set
      # repo var PATH_B=true and add ORIGIN_URL + EDGE_SECRET secrets.
      - name: Point Worker at container origin (path B)
        if: vars.PATH_B == 'true'
        run: |
          echo "${{ secrets.ORIGIN_URL }}"  | npx wrangler secret put ORIGIN_URL
          echo "${{ secrets.EDGE_SECRET }}" | npx wrangler secret put EDGE_SECRET

  # Path B (origin on AWS). Dormant until you set repo variable DEPLOY_AWS=true and
  # add the AWS secrets/vars. Builds the origin image and pushes to ECR; App Runner
  # (configured with auto-deploy on that ECR repo) rolls it out.
  origin-image:
    needs: build
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_AWS == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Build & push origin image to ECR
        run: |
          set -euo pipefail
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          REGISTRY="$ACCOUNT.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$REGISTRY"
          IMG="$REGISTRY/ratio-3-0-origin"
          docker build -t "$IMG:${{ github.sha }}" -t "$IMG:latest" .
          docker push "$IMG:${{ github.sha }}"
          docker push "$IMG:latest"
          echo "pushed $IMG:latest"
      # ECS EXPRESS MODE deploy. These services are managed by the Express gateway (managed
      # ALB, listener rules, target groups, canary deploys). The classic
      # `update-service --force-new-deployment` FIGHTS the Express canary controller and
      # leaves a stuck two-target-group listener rule ("productionListenerRule should have
      # exactly one target group serving traffic but found 2"), accumulating failed
      # "Rollback failed" deployments. The Express-native update verb is
      # `update-express-gateway-service`. We register a new task-def revision with this
      # commit's image (the documented custom-task-definition path) and point the service at
      # it; Express then runs its canary (5% -> ~3min alarm-watch -> 3min bake -> 100%).
      #
      # STILL GATED OFF (ECS_DEPLOY=false) until validated end-to-end. Before re-enabling,
      # confirm: (1) `aws ecs update-express-gateway-service` exists in the runner's CLI;
      # (2) the canary's default rollback alarm ((4xx+5xx)/total > 1% for 2 datapoints /
      # 3min) won't FALSE-TRIP — origin returns 403 (private gate) / 404 (unknown tenant)
      # and admin-api returns 401 (unauthed) as NORMAL responses, which can trip it. Until
      # then deploy by recreating the service pinned to the new image digest (see OFCE-428).
      - name: Roll ECS Express services to the new image
        if: vars.ECS_DEPLOY == 'true'
        run: |
          set -euo pipefail
          # update-express-gateway-service is a new verb; the runner's bundled AWS CLI may
          # predate it. Self-update to latest v2 if missing, then hard-fail if still absent.
          if ! aws ecs update-express-gateway-service help >/dev/null 2>&1; then
            echo "runner AWS CLI lacks update-express-gateway-service — updating to latest v2"
            curl -sSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
            unzip -q /tmp/awscliv2.zip -d /tmp
            sudo /tmp/aws/install --update
            hash -r
          fi
          aws ecs update-express-gateway-service help >/dev/null 2>&1 \
            || { echo "::error::update-express-gateway-service unavailable after CLI update"; exit 1; }
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          REGISTRY="$ACCOUNT.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com"
          NEW_IMAGE="$REGISTRY/ratio-3-0-origin:${{ github.sha }}"
          CLUSTER=$(aws ecs list-clusters --query 'clusterArns[0]' --output text)
          # Storefront platform config (commerce API URLs + GoKwik widget config) rides the deploy
          # from repo variables, so it's the source of truth and can't drift off the task def. With
          # any of these absent the origin silently serves StubResolver sample products and the
          # GoKwik widgets stay off — so they must be re-applied on every revision, not set once.
          # DATABASE_URL is here too (from the secret, same source the edge + migrate use): without it
          # the jq-merge INHERITS whatever DATABASE_URL was already on the task def, so a changed
          # secret would silently NOT reach the origin — exactly the drift that stranded the origin on
          # the old DB region during the Neon move. Re-applying it every roll keeps all three in sync.
          ORIGIN_ENV=$(jq -cn \
            --arg COMMERCE_PRODUCT_API_URL   "${{ vars.COMMERCE_PRODUCT_API_URL }}" \
            --arg COMMERCE_CART_API_URL      "${{ vars.COMMERCE_CART_API_URL }}" \
            --arg COMMERCE_ORDER_API_URL     "${{ vars.COMMERCE_ORDER_API_URL }}" \
            --arg COMMERCE_NAV_API_URL         "${{ vars.COMMERCE_NAV_API_URL }}" \
            --arg GOKWIK_BASE_SCRIPT_URL       "${{ vars.GOKWIK_BASE_SCRIPT_URL }}" \
            --arg GOKWIK_SIDECART_SCRIPT_URL   "${{ vars.GOKWIK_SIDECART_SCRIPT_URL }}" \
            --arg GOKWIK_ENVIRONMENT           "${{ vars.GOKWIK_ENVIRONMENT }}" \
            --arg GOKWIK_CURRENCY              "${{ vars.GOKWIK_CURRENCY }}" \
            --arg GOKWIK_CURRENCY_FORMAT       "${{ vars.GOKWIK_CURRENCY_FORMAT }}" \
            --arg DATABASE_URL                 "${{ secrets.DATABASE_URL }}" \
            --arg BUNDLE_S3_BUCKET             "${{ vars.BUNDLE_S3_BUCKET }}" \
            --arg BUNDLE_S3_REGION             "${{ vars.BUNDLE_S3_REGION }}" \
            --arg BUNDLE_CDN_URL               "${{ vars.BUNDLE_CDN_URL }}" \
            '$ARGS.named | to_entries | map(select(.value != "") | {name: .key, value: .value})')
          # admin-api needs the SAME commerce backend URLs — its onboarding collection picker and
          # theme-preview resolver call the catalogue directly; without them /collections is empty and
          # the preview falls back to StubResolver sample products. It also needs the Cloudflare SaaS
          # zone/fallback that cfConfig() fails closed on in prod (edge purge + custom-domain routes).
          # These come from repo variables like the commerce/gokwik ones and are NOT defaulted here:
          # an unset CF_SAAS_* is filtered out (select .value != "") so cfConfig() still fails LOUD on
          # a misconfigured deploy rather than silently using the wrong zone. BUNDLE_S3_* are here too
          # (admin-api writes bundles on publish) so a from-scratch service recreate self-heals on the
          # next deploy instead of losing S3 config. Re-applied every roll; the jq merge only REPLACES
          # these names, so admin-api's inherited DATABASE_URL / secrets stay untouched.
          ADMIN_ENV=$(jq -cn \
            --arg COMMERCE_PRODUCT_API_URL   "${{ vars.COMMERCE_PRODUCT_API_URL }}" \
            --arg COMMERCE_CART_API_URL      "${{ vars.COMMERCE_CART_API_URL }}" \
            --arg COMMERCE_ORDER_API_URL     "${{ vars.COMMERCE_ORDER_API_URL }}" \
            --arg COMMERCE_NAV_API_URL       "${{ vars.COMMERCE_NAV_API_URL }}" \
            --arg CF_SAAS_ZONE               "${{ vars.CF_SAAS_ZONE }}" \
            --arg CF_SAAS_FALLBACK           "${{ vars.CF_SAAS_FALLBACK }}" \
            --arg BUNDLE_S3_BUCKET           "${{ vars.BUNDLE_S3_BUCKET }}" \
            --arg BUNDLE_S3_REGION           "${{ vars.BUNDLE_S3_REGION }}" \
            '$ARGS.named | to_entries | map(select(.value != "") | {name: .key, value: .value})')
          # origin + admin-api both run this one image with their own task-def command/env.
          for SVC in $(aws ecs list-services --cluster "$CLUSTER" --query 'serviceArns[]' --output text); do
            CUR_TD=$(aws ecs describe-services --cluster "$CLUSTER" --services "$SVC" \
              --query 'services[0].deployments[?status==`PRIMARY`].taskDefinition | [0]' --output text)
            echo "rolling ${SVC##*/}: $CUR_TD -> $NEW_IMAGE"
            # origin gets the storefront env; admin-api gets commerce + CF SaaS; else untouched. Each
            # service runs as its OWN dedicated task role (OFCE-620): origin read-only, admin-api
            # read-write on the bundle bucket. A future unrelated service gets no role (ROLE='').
            case "${SVC##*/}" in
              *admin*) OV="$ADMIN_ENV"; ROLE="${{ vars.ADMIN_TASK_ROLE_ARN }}" ;;
              *origin*) OV="$ORIGIN_ENV"; ROLE="${{ vars.ORIGIN_TASK_ROLE_ARN }}" ;;
              *) OV='[]'; ROLE='' ;;
            esac
            aws ecs describe-task-definition --task-definition "$CUR_TD" \
              --query 'taskDefinition' --output json \
            | jq --arg img "$NEW_IMAGE" --argjson ov "$OV" --arg role "$ROLE" '
                .containerDefinitions[0].image = $img
                | .containerDefinitions[0].environment =
                    (((.containerDefinitions[0].environment // [])
                       | map(select(.name as $n | ($ov | map(.name) | index($n)) | not)))
                     + $ov)
                # taskRoleArn is a top-level field (not env), so the app gets S3 creds via the task
                # role. Re-assert it every roll so a from-scratch recreate self-heals; skip if unset.
                | (if $role != "" then .taskRoleArn = $role else . end)
                | del(.taskDefinitionArn,.revision,.status,.requiresAttributes,
                      .compatibilities,.registeredAt,.registeredBy)' > /tmp/td.json
            NEW_TD=$(aws ecs register-task-definition --cli-input-json file:///tmp/td.json \
              --query 'taskDefinition.taskDefinitionArn' --output text)
            aws ecs update-express-gateway-service \
              --service-arn "$SVC" --task-definition-arn "$NEW_TD" >/dev/null
          done
          # Poll the PRIMARY deployment's rolloutState. Express canary is slower than a
          # rolling update (~6+ min/service: 5% + alarm-watch + bake), so use a wide ceiling.
          # COMPLETED = new tasks healthy and 100% shifted; FAILED = canary alarm rollback.
          echo "waiting for Express canary rollouts to complete…"
          deadline=$(( $(date +%s) + 1500 ))   # 25 min ceiling
          for SVC in $(aws ecs list-services --cluster "$CLUSTER" --query 'serviceArns[]' --output text); do
            name=${SVC##*/}
            while :; do
              ROLL=$(aws ecs describe-services --cluster "$CLUSTER" --services "$SVC" \
                --query 'services[0].deployments[?status==`PRIMARY`].rolloutState | [0]' --output text)
              case "$ROLL" in
                COMPLETED) echo "$name: rollout complete"; break ;;
                FAILED)    echo "::error::$name: deployment rollout FAILED (canary alarm rollback?)"; exit 1 ;;
              esac
              if [ "$(date +%s)" -ge "$deadline" ]; then
                echo "::error::$name: rollout not complete within 25m (state=$ROLL)"; exit 1
              fi
              sleep 20
            done
          done
          echo "ECS Express rolled to $NEW_IMAGE; all rollouts COMPLETED"

  # Purge the Cloudflare edge cache after a deploy so cached pages pick up new
  # content. Dormant until repo var PURGE_CACHE=true + token has Zone:CachePurge:Edit.
  # (Interim: purge_everything; exact surrogate-key purge is the S1/ADR-005 refinement.)
  purge:
    needs: [deploy, origin-image]
    if: github.ref == 'refs/heads/main' && vars.PURGE_CACHE == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Purge Cloudflare cache
        run: |
          ZID=$(curl -s "https://api.cloudflare.com/client/v4/zones?name=ratiodev.in" -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" | jq -r '.result[0].id')
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$ZID/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' | jq '{success, errors:(.errors|map(.message))}'

  # Admin portal SPA (apps/admin, OFCE-362 slice 3). Built + tested on every push.
  # Deploy to Cloudflare Pages is dormant until repo var DEPLOY_ADMIN_UI=true (needs a
  # Pages project 'ratio-admin', secret CLERK_PUBLISHABLE_KEY, and var ADMIN_API_URL).
  admin-ui:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # admin-web is a bun workspace member (no per-app npm lockfile); install from the root like
      # the build job, then run its scripts with `bun run --cwd`.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run --cwd apps/admin-web typecheck
      - run: bun run --cwd apps/admin-web test
      - name: Build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          VITE_ADMIN_API_URL: ${{ vars.ADMIN_API_URL }}
        run: bun run --cwd apps/admin-web build
      - name: Deploy to Cloudflare Pages
        if: github.ref == 'refs/heads/main' && vars.DEPLOY_ADMIN_UI == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '7f06c71e716a0e4a5d38073c16758c60'
        run: |
          # Create the Pages project if it doesn't exist yet (idempotent).
          bunx wrangler pages project create ratio-admin --production-branch=main 2>/dev/null || true
          bunx wrangler pages deploy apps/admin-web/dist --project-name=ratio-admin --branch=main
