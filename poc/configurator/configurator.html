<!doctype html>
<!-- OFCE-491 / R2 tail · the hardest island: a multi-step configurator with dependent validation.
     Open in a browser: pick Model → Colour (depends on model) → Size (depends on model+colour,
     out-of-stock blocked) → summary. Price updates reactively. Runtime = Alpine only. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Configurator — OFCE-491 R2 island</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 560px; margin: 2rem auto; padding: 0 1rem; }
      .steps { display: flex; gap: 6px; margin-bottom: 1rem; }
      .steps span { flex: 1; height: 4px; border-radius: 2px; background: #ddd; }
      .steps span.on { background: #111; }
      .opts { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
      button.opt { padding: 10px 14px; border: 1px solid #ccc; border-radius: 8px; background: #fff; cursor: pointer; }
      button.opt.sel { border-color: #111; background: #111; color: #fff; }
      button.opt:disabled { opacity: 0.4; cursor: not-allowed; text-decoration: line-through; }
      .bar { display: flex; align-items: center; justify-content: space-between; margin-top: 20px; }
      .price { font-size: 22px; font-weight: 700; }
      .btn { padding: 10px 18px; border: 0; border-radius: 8px; background: #111; color: #fff; cursor: pointer; }
      .btn:disabled { opacity: 0.4; cursor: not-allowed; }
      [x-cloak] { display: none; }
    </style>
    <script src="./configurator.island.js"></script>
    <script defer src="https://unpkg.com/alpinejs@3/dist/cdn.min.js"></script>
  </head>
  <body x-data="configurator" x-cloak>
    <h1>Build your device</h1>
    <div class="steps">
      <span :class="step >= 1 && 'on'"></span>
      <span :class="step >= 2 && 'on'"></span>
      <span :class="step >= 3 && 'on'"></span>
      <span :class="step >= 4 && 'on'"></span>
    </div>

    <!-- Step 1: model -->
    <div x-show="step === 1">
      <h3>1 · Model</h3>
      <div class="opts">
        <template x-for="m in catalog.models" :key="m.id">
          <button class="opt" :class="model === m.id && 'sel'" @click="pickModel(m.id)" x-text="m.name"></button>
        </template>
      </div>
    </div>

    <!-- Step 2: colour (depends on model) -->
    <div x-show="step === 2">
      <h3>2 · Colour</h3>
      <div class="opts">
        <template x-for="c in colors" :key="c.id">
          <button class="opt" :class="color === c.id && 'sel'" @click="pickColor(c.id)"
                  x-text="c.name + (c.add ? ' +₹' + c.add : '')"></button>
        </template>
      </div>
    </div>

    <!-- Step 3: size (depends on model+colour; out-of-stock disabled) -->
    <div x-show="step === 3">
      <h3>3 · Size</h3>
      <div class="opts">
        <template x-for="s in sizes" :key="s.id">
          <button class="opt" :class="size === s.id && 'sel'" :disabled="!s.stock" @click="pickSize(s.id)"
                  x-text="s.name + (s.stock ? '' : ' (out)')"></button>
        </template>
      </div>
    </div>

    <!-- Step 4: summary -->
    <div x-show="step === 4">
      <h3>4 · Summary</h3>
      <p>
        <span x-text="catalog.models.find(m => m.id === model)?.name"></span> ·
        <span x-text="color"></span> · <span x-text="(size || '').toUpperCase()"></span>
      </p>
      <button class="btn" @click="addToCart()" :disabled="!complete || adding"
              x-text="added ? 'Added ✓' : adding ? 'Adding…' : 'Add to cart'"></button>
    </div>

    <div class="bar">
      <button class="btn" style="background:#666" @click="back()" x-show="step > 1">Back</button>
      <span class="price">₹<span x-text="price"></span></span>
      <button class="btn" @click="next()" :disabled="!canNext" x-show="step < 4">Next</button>
    </div>
  </body>
</html>
